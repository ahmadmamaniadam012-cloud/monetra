<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F5C3A">
<title>Monetra</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: one narrow column built for phones: search first, listings grid, then the seller pitch. */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --ink:#14221A; --muted:#566559; --line:#D8DED5;
  --brand:#0F5C3A; --brand-ink:#FFFFFF; --pop:#F5B72A; --pop-ink:#241A00;
  --wa:#11833F; --wa-ink:#FFFFFF; --danger:#B3261E;
  --t1:#DCEBDD; --t2:#F6E7C1; --t3:#DCE6F2; --t4:#F0DCD6; --t5:#E3DDF0;
  --font-display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1410; --surface:#16201A; --ink:#E8EFE9; --muted:#9AAA9F; --line:#26332B;
  --brand:#4CC38A; --brand-ink:#06210F; --pop:#F5B72A; --pop-ink:#241A00;
  --wa:#2FBF71; --wa-ink:#04210F; --danger:#FF8A80;
  --t1:#1C3326; --t2:#3A3015; --t3:#1B2B3D; --t4:#3B2520; --t5:#2B2540; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1410; --surface:#16201A; --ink:#E8EFE9; --muted:#9AAA9F; --line:#26332B;
  --brand:#4CC38A; --brand-ink:#06210F; --pop:#F5B72A; --pop-ink:#241A00;
  --wa:#2FBF71; --wa-ink:#04210F; --danger:#FF8A80;
  --t1:#1C3326; --t2:#3A3015; --t3:#1B2B3D; --t4:#3B2520; --t5:#2B2540; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);
  padding-block:0 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.15}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 8px}
.brand h1{font-size:1.5rem;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;background:var(--brand);color:var(--brand-ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pop{background:var(--pop);color:var(--pop-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.wa{background:var(--wa);color:var(--wa-ink);width:100%}
.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
.btn.small{padding:6px 10px;font-size:.8rem;border-radius:8px}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.search{position:relative;margin:10px 0 12px}
.search input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:.88rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.count{color:var(--muted);font-size:.85rem;margin:4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.tile{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font:700 2.2rem var(--font-display);color:var(--ink);position:relative;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:8px;left:8px;font:600 .68rem var(--font-body);letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--pop);color:var(--pop-ink)}
.badge.sample{background:var(--ink);color:var(--bg)}
.badge.sold{background:var(--danger);color:#fff}
.cbody{padding:10px 11px 12px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.price{font:700 1.1rem var(--font-display);font-variant-numeric:tabular-nums}
.cbody h3{font:600 .95rem/1.3 var(--font-body);overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.desc{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.cbody .btn{margin-top:auto}
.cbody .spacer{flex:1}
.ad{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:2px 0 12px;background:var(--surface)}.ad>div{min-width:0;flex:1 1 180px}.ad b{font-family:var(--font-display);overflow-wrap:anywhere}.ad small{display:block;color:var(--muted);font-size:.78rem;overflow-wrap:anywhere}.ad .tag{display:block;font:600 .65rem var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.hero{position:relative;overflow:hidden;margin-top:14px;background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:18px 18px 20px;background-image:radial-gradient(circle at 100% 100%,rgba(255,255,255,.16) 0 110px,transparent 111px),radial-gradient(circle at 0% 0%,rgba(255,255,255,.10) 0 60px,transparent 61px)}
.hero h1{font-size:clamp(1.7rem,7vw,2.7rem);letter-spacing:-.02em;margin:14px 0 8px;max-width:20ch}
.hero p{margin:0 0 16px;max-width:42ch;opacity:.92}
.brandrow{display:flex;align-items:center;gap:9px;font:700 1.05rem var(--font-display)}
.logo{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;background:var(--pop);color:var(--pop-ink);font:700 1.1rem var(--font-display);transform:rotate(-6deg)}
.heroact{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sticker{display:inline-block;background:var(--pop);color:var(--pop-ink);font:700 .8rem var(--font-display);text-transform:uppercase;letter-spacing:.05em;padding:6px 12px;border-radius:999px;transform:rotate(-5deg)}
.ticker{overflow:hidden;margin:12px 0 6px;border-block:1px solid var(--line);padding:8px 0}
.tk{display:flex;width:max-content;animation:slide 26s linear infinite;font:600 .82rem var(--font-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tk span{padding-right:28px;white-space:nowrap}
.tk span::after{content:"\2022";margin-left:28px;color:var(--pop)}
@keyframes slide{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tk{animation:none}.ticker{overflow-x:auto}}
.chip{background:var(--c,var(--surface))}
.price{display:inline-block;align-self:flex-start;background:var(--pop);color:var(--pop-ink);padding:1px 10px;border-radius:999px}
.empty{padding:28px 16px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted)}
section.sell{margin-top:30px;background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:22px 18px}
section.sell h2{font-size:1.45rem;margin-bottom:8px}
section.sell p{margin:6px 0;white-space:pre-line;overflow-wrap:anywhere}
section.sell .steps{display:grid;gap:8px;margin:14px 0}
section.sell .steps div{background:rgba(255,255,255,.12);border-radius:10px;padding:9px 12px;font-size:.92rem}
footer{margin-top:22px;color:var(--muted);font-size:.8rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.panel{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.panel h2{font-size:1.15rem;margin-bottom:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
.form input,.form select,.form textarea{padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;width:100%}
.form .check{flex-direction:row;align-items:center;gap:8px}
.form .check input{width:auto}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.rows{display:grid;gap:8px;margin-top:12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.row .nm{min-width:0;flex:1 1 140px;overflow-wrap:anywhere;font-size:.9rem}
.row .acts{display:flex;gap:6px;flex-wrap:wrap}
.bar{position:sticky;bottom:0;margin-top:16px;padding:12px;background:var(--pop);color:var(--pop-ink);border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600}
.bar .btn{background:var(--pop-ink);color:var(--pop)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:20;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}

.tabs{display:flex;gap:8px;margin:14px 0}
.tabs .chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.note{color:var(--muted);font-size:.85rem;margin:6px 0}
.err{color:var(--danger);font-size:.88rem;margin:8px 0;min-height:1em}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 4px}
.topbar .brandrow{font:700 1.15rem var(--font-display)}
.topbar .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.agree{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.88rem}
.pill{display:inline-block;font:600 .7rem var(--font-body);text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:6px;background:var(--line);color:var(--ink)}
.pill.ok{background:var(--brand);color:var(--brand-ink)}
.pill.bad{background:var(--danger);color:#fff}
.back{margin:12px 0}

.msgs{display:flex;flex-direction:column;gap:6px;max-height:55vh;min-height:120px;overflow-y:auto;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.b{max-width:82%;padding:8px 11px;border-radius:12px;background:var(--surface);border:1px solid var(--line);overflow-wrap:anywhere;white-space:pre-wrap;align-self:flex-start}
.b.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.sendrow{display:flex;gap:8px;margin-top:10px}
.sendrow input{flex:1;min-width:0;padding:11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
</style></head><body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,updateDoc,deleteDoc,query,where,onSnapshot,serverTimestamp,addDoc,orderBy} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {CONFIG} from "./config.js";

var CATS=['Phones & Gadgets','Fashion & Tailoring','Food','Home & Repairs','Beauty','Tutoring','Transport & Delivery','Other'];
var AREAS=['Sabon Gari','Barade','Magami','Mayo Gwoi'];
var app=document.getElementById('app');
var configured=CONFIG&&CONFIG.firebase&&CONFIG.firebase.apiKey&&CONFIG.firebase.apiKey.indexOf('PASTE')<0;
var S={view:'home',user:null,chats:[],msgs:[],chatId:null,chatMeta:null,approved:[],all:[],settings:{commission:7,whatsapp:'',adTitle:'',adText:'',adPhone:''},q:'',cat:'All',tab:'in',err:'',busy:false,photo:'',toast:''};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function naira(n){return '₦'+Number(n).toLocaleString('en-NG')}
function wa(num,text){var d=String(num||'').replace(/\D/g,'');if(!d)return '';if(d.charAt(0)==='0')d='234'+d.slice(1);else if(d.length===10)d='234'+d;return 'https://wa.me/'+d+(text?'?text='+encodeURIComponent(text):'')}
function tileColor(c){return 'var(--t'+(Math.max(0,CATS.indexOf(c))%5+1)+')'}
function initials(s){return String(s).trim().split(/\s+/).slice(0,2).map(function(w){return w.charAt(0)}).join('').toUpperCase()}
function toast(m){var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},3200)}
function isAdmin(){return !!(S.user&&S.user.email&&CONFIG.adminEmail&&S.user.email.toLowerCase()===String(CONFIG.adminEmail).toLowerCase())}
function myDoc(){return S.user?S.all.find(function(x){return x.id===S.user.uid})||S.mine||null:null}

var auth,db;
if(configured){
  var fb=initializeApp(CONFIG.firebase);auth=getAuth(fb);db=getFirestore(fb);
  onSnapshot(query(collection(db,'services'),where('status','==','approved')),function(s){S.approved=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});if(S.view==='home')renderGrid()},function(){});
  onSnapshot(doc(db,'settings','main'),function(s){if(s.exists()){S.settings=Object.assign(S.settings,s.data());if(S.view==='home')renderAd()}},function(){});
  var unsubAll=null,unsubMine=null,unsubChats=null,unsubMsgs=null;
  onAuthStateChanged(auth,function(u){
    S.user=u;if(unsubChats){unsubChats();unsubChats=null}S.chats=[];if(unsubAll){unsubAll();unsubAll=null}if(unsubMine){unsubMine();unsubMine=null}S.all=[];S.mine=null;
    if(u&&isAdmin()){unsubAll=onSnapshot(collection(db,'services'),function(s){S.all=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});if(S.view==='admin')render()},function(){})}
    else if(u){unsubMine=onSnapshot(doc(db,'services',u.uid),function(s){S.mine=s.exists()?Object.assign({id:s.id},s.data()):null;if(S.view==='join')render()},function(){})}
    if(u){unsubChats=onSnapshot(query(collection(db,'chats'),where('participants','array-contains',u.uid)),function(s){S.chats=s.docs.map(function(d){return Object.assign({id:d.id},d.data({serverTimestamps:'estimate'}))});S.chats.sort(function(a,b){return ms(b.updatedAt)-ms(a.updatedAt)});if(S.view==='inbox')render();var bt=document.querySelector('[data-go="inbox"]');if(bt){var n=unreadCount();bt.textContent='Messages'+(n?' ('+n+')':'')}},function(){})}
    if(!u&&(S.view==='inbox'||S.view==='chat'))S.view='home';
    if(S.view==='auth'&&u)S.view='home';render();
  });
}
function go(v){if(v!=='chat'&&unsubMsgs){unsubMsgs();unsubMsgs=null}S.view=v;S.err='';S.photo='';render();window.scrollTo(0,0)}

function header(){
  var a=[];
  if(S.user){var nu=unreadCount();a.push('<button class="btn ghost small" data-go="inbox">Messages'+(nu?' ('+nu+')':'')+'</button>');a.push('<button class="btn ghost small" data-go="join">'+(isAdmin()?'':'My service')+'</button>');if(isAdmin())a.push('<button class="btn small" data-go="admin">Admin</button>');a.push('<button class="btn ghost small" id="out">Sign out</button>')}
  else a.push('<button class="btn small" data-go="auth">Sign in</button>');
  return '<div class="topbar"><div class="brandrow">Monetra</div><div class="acts">'+a.filter(function(x){return x.indexOf('></button>')<0}).join('')+'</div></div>';
}
function render(){
  if(!configured){app.innerHTML='<div class="wrap"><div class="panel"><h2>Almost ready</h2><p>This app needs its database connected. Open <b>config.js</b> on GitHub and paste your Firebase details.</p></div></div>';return}
  if((S.view==='join'||S.view==='inbox'||S.view==='chat')&&!S.user)S.view='auth';
  var v=S.view,h='<div class="wrap">'+header();
  if(v==='home')h+=homeView();else if(v==='auth')h+=authView();else if(v==='join')h+=joinView();else if(v==='inbox')h+=inboxView();else if(v==='chat')h+=chatView();else if(v==='admin'&&isAdmin())h+=adminView();else h+=homeView();
  app.innerHTML=h+'</div>';
  if(v==='home'||S.view==='home'){renderChips();renderGrid();renderAd()}
  if(S.view==='chat')renderMsgs();
}
function homeView(){
  return '<header class="hero"><div class="brandrow"><span class="logo">M</span><b>Monetra</b></div><h1>Find any service in Jalingo.</h1><p>Tailors, repairers, tutors, riders and more. See the price, then chat inside the app. Free to use, free to join.</p>'+
   '<div class="heroact"><button class="btn pop" data-go="join">Offer your service</button><span class="sticker">100% free</span></div></header>'+
   '<div class="search"><input id="q" type="search" placeholder="Search: tailor, phone repair, delivery..." aria-label="Search services" autocomplete="off" value="'+esc(S.q)+'"></div>'+
   '<div class="chips" id="chips" role="group" aria-label="Categories"></div><div id="ad"></div><div class="count" id="count" aria-live="polite"></div><div class="grid" id="grid"></div>'+
   '<footer><span>Meet in a public place and check the work before you pay.</span></footer>';
}
function renderChips(){var el=document.getElementById('chips');if(!el)return;el.innerHTML=['All'].concat(CATS).map(function(c){return '<button type="button" class="chip" style="--c:'+(c==='All'?'var(--surface)':tileColor(c))+'" data-cat="'+esc(c)+'" aria-pressed="'+(c===S.cat)+'">'+esc(c)+'</button>'}).join('')}
function renderAd(){
  var el=document.getElementById('ad');if(!el)return;var s=S.settings;
  var title=s.adTitle||'Your shop here',text=s.adText||'Reach people in Jalingo every day. Advertise on Monetra.';
  var link=wa(s.adTitle?s.adPhone:s.whatsapp,s.adTitle?'Hello, I saw your ad on Monetra.':'Hello, I want to advertise on Monetra.');
  el.innerHTML='<div class="ad"><div><span class="tag">'+(s.adTitle?'Ad':'Advertise here')+'</span><b>'+esc(title)+'</b><small>'+esc(text)+'</small></div>'+(link?'<a class="btn small" href="'+esc(link)+'" target="_blank" rel="noopener">'+(s.adTitle?'Chat':'Ask about ads')+'</a>':'')+'</div>';
}
function renderGrid(){
  var g=document.getElementById('grid');if(!g)return;var t=S.q.trim().toLowerCase();
  var list=S.approved.filter(function(l){if(S.cat!=='All'&&l.cat!==S.cat)return false;if(!t)return true;return (l.title+' '+l.desc+' '+l.area+' '+l.cat+' '+l.name).toLowerCase().indexOf(t)>-1});
  list.sort(function(a,b){return (b.featured?1:0)-(a.featured?1:0)});
  document.getElementById('count').textContent=list.length+(list.length===1?' service':' services')+(t||S.cat!=='All'?' found':' available');
  if(!list.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">'+(S.approved.length?'Nothing matches. Try a shorter word.':'No services yet. Be the first. It is free to join.')+'</div>';return}
  g.innerHTML=list.map(function(l){
    var media=l.photo?'<img src="'+esc(l.photo)+'" alt="'+esc(l.title)+'" loading="lazy">':esc(initials(l.name||l.title));
    var mine=S.user&&S.user.uid===l.id;
    return '<article class="card"><div class="tile" style="background:'+tileColor(l.cat)+'">'+(l.featured?'<span class="badge">Featured</span>':'')+media+'</div><div class="cbody"><div class="price">'+(l.price?'From '+naira(l.price):'Ask price')+'</div><h3>'+esc(l.title)+'</h3><div class="meta">'+esc(l.name)+' · '+esc(l.area)+'</div>'+(l.desc?'<div class="desc">'+esc(l.desc)+'</div>':'')+'<div class="spacer"></div>'+(mine?'<span class="btn wa" aria-disabled="true">Your service</span>':'<button class="btn wa" type="button" data-chat="'+esc(l.id)+'" data-title="'+esc(l.title)+'" data-pname="'+esc(l.name)+'">Chat now</button>')+'</div></article>';
  }).join('');
}
function authView(){
  var up=S.tab==='up';
  return '<div class="panel"><div class="tabs"><button class="chip" data-tab="in" aria-pressed="'+!up+'">Sign in</button><button class="chip" data-tab="up" aria-pressed="'+up+'">Create account</button></div>'+
   '<div class="form">'+(up?'<label class="full">Your name<input id="a_name" maxlength="40" autocomplete="name"></label>':'')+'<label class="full">Email<input id="a_email" type="email" autocomplete="email" inputmode="email"></label><label class="full">Password (6 or more characters)<input id="a_pass" type="password" autocomplete="'+(up?'new-password':'current-password')+'"></label>'+
   '<div class="full err" id="err" role="alert">'+esc(S.err)+'</div><div class="full"><button class="btn" id="authGo" type="button">'+(up?'Create account':'Sign in')+'</button> <button class="btn ghost" data-go="home" type="button">Back</button></div></div></div>';
}
function joinView(){
  var d=S.mine||{},st=d.status,c=S.settings.commission;
  var opts=CATS.map(function(x){return '<option'+(x===d.cat?' selected':'')+'>'+esc(x)+'</option>'}).join('');
  var dl=AREAS.map(function(x){return '<option value="'+esc(x)+'">'}).join('');
  return '<div class="panel"><h2>'+(d.id?'Your service':'Offer your service')+'</h2>'+
   (st?'<p>Status: <span class="pill '+(st==='approved'?'ok':st==='removed'?'bad':'')+'">'+(st==='approved'?'Live':st==='pending'?'Waiting for approval':'Removed')+'</span></p>':'')+
   '<div class="form"><label class="full">What do you do? (example: Phone screen repair)<input id="j_title" maxlength="80" value="'+esc(d.title)+'"></label>'+
   '<label>Your name<input id="j_name" maxlength="40" value="'+esc(d.name)+'"></label><label>Starting price (₦)<input id="j_price" inputmode="numeric" value="'+esc(d.price||'')+'"></label>'+
   '<label>Category<select id="j_cat">'+opts+'</select></label><label>Area<input id="j_area" list="areas" maxlength="40" value="'+esc(d.area)+'"></label><datalist id="areas">'+dl+'</datalist>'+
   '<label class="full">About your service<textarea id="j_desc" rows="3" maxlength="200">'+esc(d.desc)+'</textarea></label>'+
   '<label class="full">Photo<input id="j_photo" type="file" accept="image/*"></label>'+
   '<div class="full agree"><label class="check" style="flex-direction:row;gap:8px;color:var(--ink);font-size:.9rem"><input id="j_agree" type="checkbox" style="width:auto"'+(d.agreed?' checked':'')+'> <span>I agree that Monetra takes <b>'+esc(c)+'%</b> of the payment for jobs that come through the app. It is free to join.</span></label></div>'+
   '<div class="full err" id="err" role="alert">'+esc(S.err)+'</div><div class="full"><button class="btn" id="joinGo" type="button">'+(d.id?'Save changes':'Send for approval')+'</button> <button class="btn ghost" data-go="home" type="button">Back</button>'+(d.id?' <button class="btn danger" id="delMine" type="button">Delete my service</button>':'')+'</div></div></div>';
}
function adminView(){
  var p=S.all.filter(function(x){return x.status==='pending'}),a=S.all.filter(function(x){return x.status==='approved'});
  function row(x,acts){return '<div class="row"><div class="nm"><b>'+esc(x.title)+'</b><br><small>'+esc(x.name)+' · '+esc(x.area)+'</small></div><div class="acts">'+acts+'</div></div>'}
  var s=S.settings;
  return '<div class="back"><button class="btn ghost small" data-go="home">Back to app</button></div>'+
   '<div class="panel"><h2>Waiting for approval ('+p.length+')</h2><div class="rows">'+p.map(function(x){return row(x,'<button class="btn small" data-act="approve" data-id="'+x.id+'">Approve</button><button class="btn danger small" data-act="remove" data-id="'+x.id+'">Reject</button>')}).join('')+(p.length?'':'<div class="empty">Nothing waiting.</div>')+'</div></div>'+
   '<div class="panel"><h2>Live services ('+a.length+')</h2><div class="rows">'+a.map(function(x){return row(x,'<button class="btn ghost small" data-act="feat" data-id="'+x.id+'">'+(x.featured?'Unfeature':'Feature')+'</button><button class="btn danger small" data-act="remove" data-id="'+x.id+'">Remove</button>')}).join('')+(a.length?'':'<div class="empty">No live services yet.</div>')+'</div></div>'+
   '<div class="panel"><h2>Your settings</h2><div class="form"><label>Commission (%)<input id="s_comm" inputmode="numeric" value="'+esc(s.commission)+'"></label><label>Your WhatsApp<input id="s_wa" inputmode="tel" value="'+esc(s.whatsapp)+'"></label>'+
   '<label class="full">Advertiser name (empty shows Your shop here)<input id="s_adt" value="'+esc(s.adTitle)+'"></label><label class="full">Advertiser message<input id="s_adm" value="'+esc(s.adText)+'"></label><label class="full">Advertiser WhatsApp<input id="s_adp" inputmode="tel" value="'+esc(s.adPhone)+'"></label>'+
   '<div class="full"><button class="btn" id="saveSet" type="button">Save settings</button></div></div></div>';
}

function ms(t){return t&&t.toMillis?t.toMillis():Date.now()}
function getSeen(id){try{return Number(localStorage.getItem('seen_'+id))||0}catch(e){return 0}}
function markSeen(id){try{localStorage.setItem('seen_'+id,String(Date.now()))}catch(e){}}
function isUnread(c){return !!S.user&&!!c.lastFrom&&c.lastFrom!==S.user.uid&&ms(c.updatedAt)>getSeen(c.id)}
function unreadCount(){return S.chats.filter(isUnread).length}
function otherName(c){return S.user&&S.user.uid===c.providerUid?(c.buyerName||'Customer'):(c.providerName||'Provider')}
function inboxView(){
  var rows=S.chats.map(function(c){return '<div class="row"><div class="nm"><b>'+esc(otherName(c))+'</b>'+(isUnread(c)?' <span class="pill ok">New</span>':'')+'<br><small>'+esc(c.serviceTitle||'')+(c.lastText?' · '+esc(c.lastText):'')+'</small></div><button class="btn small" data-open="'+esc(c.id)+'" type="button">Open</button></div>'}).join('');
  return '<div class="back"><button class="btn ghost small" data-go="home">Back</button></div><div class="panel"><h2>Messages</h2><div class="rows">'+(rows||'<div class="empty">No messages yet. Open a service and tap Chat now.</div>')+'</div></div>';
}
function chatView(){
  var c=S.chatMeta||S.chats.find(function(x){return x.id===S.chatId})||{};
  return '<div class="back"><button class="btn ghost small" data-go="inbox">Back</button></div><div class="panel"><h2>'+esc(otherName(c))+'</h2><div class="note">'+esc(c.serviceTitle||'')+'</div><div class="msgs" id="msgs" aria-live="polite"></div><div class="sendrow"><input id="m_in" maxlength="1000" placeholder="Type a message" autocomplete="off"><button class="btn" id="sendBtn" type="button">Send</button></div><div class="note">Agree the price and details here.</div></div>';
}
function renderMsgs(){
  var el=document.getElementById('msgs');if(!el)return;
  el.innerHTML=S.msgs.length?S.msgs.map(function(m){return '<div class="b'+(S.user&&m.from===S.user.uid?' me':'')+'">'+esc(m.text)+'</div>'}).join(''):'<div class="note">Say hello. Write what you need and the price you can pay.</div>';
  el.scrollTop=el.scrollHeight;
}
function showChat(id){
  if(unsubMsgs){unsubMsgs();unsubMsgs=null}
  S.chatId=id;S.msgs=[];S.chatMeta=S.chats.find(function(x){return x.id===id})||S.chatMeta;
  markSeen(id);S.view='chat';render();window.scrollTo(0,0);
  unsubMsgs=onSnapshot(query(collection(db,'chats',id,'messages'),orderBy('at')),function(s){S.msgs=s.docs.map(function(d){return d.data({serverTimestamps:'estimate'})});markSeen(id);renderMsgs()},function(){toast('Could not load messages.')});
}
async function openChat(pid,title,pname){
  if(!S.user){S.tab='in';go('auth');return}
  if(pid===S.user.uid){toast('This is your own service.');return}
  var id=pid+'_'+S.user.uid;
  var meta={providerUid:pid,buyerUid:S.user.uid,participants:[pid,S.user.uid],providerName:pname||'Provider',buyerName:S.user.displayName||'Customer',serviceTitle:title||''};
  try{await setDoc(doc(db,'chats',id),meta,{merge:true})}catch(e){toast('Could not open the chat. Try again.');return}
  S.chatMeta=Object.assign({id:id},meta);showChat(id);
}
async function sendMsg(){
  var inp=document.getElementById('m_in');if(!inp||!S.user||!S.chatId)return;
  var txt=inp.value.trim().slice(0,1000);if(!txt)return;inp.value='';
  try{
    await addDoc(collection(db,'chats',S.chatId,'messages'),{from:S.user.uid,text:txt,at:serverTimestamp()});
    await updateDoc(doc(db,'chats',S.chatId),{lastText:txt.slice(0,80),lastFrom:S.user.uid,updatedAt:serverTimestamp()});
  }catch(e){inp.value=txt;toast('Message not sent. Check your connection.')}
}
function resize(file){return new Promise(function(res,rej){var r=new FileReader();r.onerror=rej;r.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){var m=480,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);var q=.72,u=c.toDataURL('image/jpeg',q);while(u.length>140000&&q>.3){q-=.1;u=c.toDataURL('image/jpeg',q)}res(u)};im.src=r.result};r.readAsDataURL(file)})}
function authErr(e){var c=e&&e.code||'';if(c.indexOf('invalid-email')>-1)return 'That email does not look right.';if(c.indexOf('weak-password')>-1)return 'Use a password with at least 6 characters.';if(c.indexOf('email-already')>-1)return 'This email already has an account. Tap Sign in.';if(c.indexOf('invalid-credential')>-1||c.indexOf('wrong-password')>-1||c.indexOf('user-not-found')>-1)return 'Wrong email or password.';if(c.indexOf('network')>-1)return 'No connection. Check your data and try again.';return 'Something went wrong. Try again.'}
function setErr(m){S.err=m;var e=document.getElementById('err');if(e)e.textContent=m}

app.addEventListener('keydown',function(e){if(e.target.id==='m_in'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}});
app.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;renderGrid()}});
app.addEventListener('change',function(e){if(e.target.id==='j_photo'){var f=e.target.files&&e.target.files[0];if(!f)return;resize(f).then(function(d){S.photo=d;toast('Photo ready')}).catch(function(){toast('Could not read that photo.')})}});
app.addEventListener('click',async function(e){
  var t=e.target.closest('button,a');if(!t)return;
  if(t.dataset.chat){openChat(t.dataset.chat,t.dataset.title,t.dataset.pname);return}
  if(t.dataset.open){showChat(t.dataset.open);return}
  if(t.id==='sendBtn'){sendMsg();return}
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.cat){S.cat=t.dataset.cat;renderChips();renderGrid();return}
  if(t.dataset.tab){S.tab=t.dataset.tab;S.err='';render();return}
  if(t.id==='out'){await signOut(auth);go('home');return}
  if(t.id==='authGo'){
    var em=document.getElementById('a_email').value.trim(),pw=document.getElementById('a_pass').value;
    if(!em||!pw){setErr('Enter your email and password.');return}
    t.disabled=true;try{if(S.tab==='up'){var nm=(document.getElementById('a_name').value||'').trim();if(!nm){setErr('Enter your name.');t.disabled=false;return}var cr=await createUserWithEmailAndPassword(auth,em,pw);try{await updateProfile(cr.user,{displayName:nm})}catch(z){}}else await signInWithEmailAndPassword(auth,em,pw)}catch(x){setErr(authErr(x));t.disabled=false}return}
  if(t.id==='joinGo'){
    var g=function(i){return document.getElementById(i).value.trim()};
    var title=g('j_title'),name=g('j_name');
    if(!title||!name){setErr('Fill in what you do and your name.');return}
    if(!document.getElementById('j_agree').checked){setErr('Please tick the box to agree to the commission.');return}
    var d=S.mine||{},price=parseInt(g('j_price').replace(/\D/g,''),10)||0;
    var data={ownerUid:S.user.uid,title:title,name:name,price:price,cat:document.getElementById('j_cat').value,area:g('j_area')||'Jalingo',desc:g('j_desc'),photo:S.photo||d.photo||'',agreed:true,commission:Number(S.settings.commission)||7,featured:!!d.featured,status:d.id?(d.status==='approved'?'pending':d.status):'pending'};
    if(!d.id)data.createdAt=serverTimestamp();
    t.disabled=true;try{await setDoc(doc(db,'services',S.user.uid),data,{merge:true});toast(d.id?'Saved.':'Sent. We will approve it soon.');S.photo='';go('join')}catch(x){setErr('Could not save. Check your connection and try again.');t.disabled=false}return}
  if(t.id==='delMine'){if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Tap again to delete';return}try{await deleteDoc(doc(db,'services',S.user.uid));toast('Deleted.');go('home')}catch(x){setErr('Could not delete.')}return}
  if(t.dataset.act){
    var id=t.dataset.id,x=S.all.find(function(y){return y.id===id});if(!x)return;var patch={};
    if(t.dataset.act==='approve')patch.status='approved';if(t.dataset.act==='remove')patch.status='removed';if(t.dataset.act==='feat')patch.featured=!x.featured;
    try{await updateDoc(doc(db,'services',id),patch)}catch(y){toast('Could not update.')}return}
  if(t.id==='saveSet'){
    var v=function(i){return document.getElementById(i).value.trim()};
    try{await setDoc(doc(db,'settings','main'),{commission:Math.min(30,Math.max(0,parseInt(v('s_comm'),10)||7)),whatsapp:v('s_wa'),adTitle:v('s_adt'),adText:v('s_adm'),adPhone:v('s_adp')},{merge:true});toast('Saved.')}catch(y){toast('Could not save.')}return}
});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
render();
</script>
</body></html>
