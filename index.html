<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F5C3A">
<title>Monetra</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: one narrow column built for phones: search first, listings grid, then the seller pitch. */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --ink:#14221A; --muted:#566559; --line:#D8DED5;
  --brand:#0F5C3A; --brand-ink:#FFFFFF; --pop:#F5B72A; --pop-ink:#241A00;
  --wa:#11833F; --wa-ink:#FFFFFF; --danger:#B3261E;
  --t1:#DCEBDD; --t2:#F6E7C1; --t3:#DCE6F2; --t4:#F0DCD6; --t5:#E3DDF0;
  --font-display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1410; --surface:#16201A; --ink:#E8EFE9; --muted:#9AAA9F; --line:#26332B;
  --brand:#4CC38A; --brand-ink:#06210F; --pop:#F5B72A; --pop-ink:#241A00;
  --wa:#2FBF71; --wa-ink:#04210F; --danger:#FF8A80;
  --t1:#1C3326; --t2:#3A3015; --t3:#1B2B3D; --t4:#3B2520; --t5:#2B2540; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1410; --surface:#16201A; --ink:#E8EFE9; --muted:#9AAA9F; --line:#26332B;
  --brand:#4CC38A; --brand-ink:#06210F; --pop:#F5B72A; --pop-ink:#241A00;
  --wa:#2FBF71; --wa-ink:#04210F; --danger:#FF8A80;
  --t1:#1C3326; --t2:#3A3015; --t3:#1B2B3D; --t4:#3B2520; --t5:#2B2540; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);
  padding-block:0 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.15}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 8px}
.brand h1{font-size:1.5rem;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;background:var(--brand);color:var(--brand-ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pop{background:var(--pop);color:var(--pop-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.wa{background:var(--wa);color:var(--wa-ink);width:100%}
.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
.btn.small{padding:6px 10px;font-size:.8rem;border-radius:8px}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.search{position:relative;margin:10px 0 12px}
.search input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:.88rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.count{color:var(--muted);font-size:.85rem;margin:4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.tile{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font:700 2.2rem var(--font-display);color:var(--ink);position:relative;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:8px;left:8px;font:600 .68rem var(--font-body);letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--pop);color:var(--pop-ink)}
.badge.sample{background:var(--ink);color:var(--bg)}
.badge.sold{background:var(--danger);color:#fff}
.cbody{padding:10px 11px 12px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.price{font:700 1.1rem var(--font-display);font-variant-numeric:tabular-nums}
.cbody h3{font:600 .95rem/1.3 var(--font-body);overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.desc{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.cbody .btn{margin-top:auto}
.cbody .spacer{flex:1}
.ad{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:2px 0 12px;background:var(--surface)}.ad>div{min-width:0;flex:1 1 180px}.ad b{font-family:var(--font-display);overflow-wrap:anywhere}.ad small{display:block;color:var(--muted);font-size:.78rem;overflow-wrap:anywhere}.ad .tag{display:block;font:600 .65rem var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.hero{position:relative;overflow:hidden;margin-top:14px;background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:18px 18px 20px;background-image:radial-gradient(circle at 100% 100%,rgba(255,255,255,.16) 0 110px,transparent 111px),radial-gradient(circle at 0% 0%,rgba(255,255,255,.10) 0 60px,transparent 61px)}
.hero h1{font-size:clamp(1.7rem,7vw,2.7rem);letter-spacing:-.02em;margin:14px 0 8px;max-width:20ch}
.hero p{margin:0 0 16px;max-width:42ch;opacity:.92}
.brandrow{display:flex;align-items:center;gap:9px;font:700 1.05rem var(--font-display)}
.logo{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;background:var(--pop);color:var(--pop-ink);font:700 1.1rem var(--font-display);transform:rotate(-6deg)}
.heroact{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sticker{display:inline-block;background:var(--pop);color:var(--pop-ink);font:700 .8rem var(--font-display);text-transform:uppercase;letter-spacing:.05em;padding:6px 12px;border-radius:999px;transform:rotate(-5deg)}
.ticker{overflow:hidden;margin:12px 0 6px;border-block:1px solid var(--line);padding:8px 0}
.tk{display:flex;width:max-content;animation:slide 26s linear infinite;font:600 .82rem var(--font-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tk span{padding-right:28px;white-space:nowrap}
.tk span::after{content:"\2022";margin-left:28px;color:var(--pop)}
@keyframes slide{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tk{animation:none}.ticker{overflow-x:auto}}
.chip{background:var(--c,var(--surface))}
.price{display:inline-block;align-self:flex-start;background:var(--pop);color:var(--pop-ink);padding:1px 10px;border-radius:999px}
.empty{padding:28px 16px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted)}
section.sell{margin-top:30px;background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:22px 18px}
section.sell h2{font-size:1.45rem;margin-bottom:8px}
section.sell p{margin:6px 0;white-space:pre-line;overflow-wrap:anywhere}
section.sell .steps{display:grid;gap:8px;margin:14px 0}
section.sell .steps div{background:rgba(255,255,255,.12);border-radius:10px;padding:9px 12px;font-size:.92rem}
footer{margin-top:22px;color:var(--muted);font-size:.8rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.panel{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.panel h2{font-size:1.15rem;margin-bottom:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
.form input,.form select,.form textarea{padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;width:100%}
.form .check{flex-direction:row;align-items:center;gap:8px}
.form .check input{width:auto}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.rows{display:grid;gap:8px;margin-top:12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.row .nm{min-width:0;flex:1 1 140px;overflow-wrap:anywhere;font-size:.9rem}
.row .acts{display:flex;gap:6px;flex-wrap:wrap}
.bar{position:sticky;bottom:0;margin-top:16px;padding:12px;background:var(--pop);color:var(--pop-ink);border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600}
.bar .btn{background:var(--pop-ink);color:var(--pop)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:20;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
</style></head><body>
<div id="app"></div>
<script>
(function(){
var CATS=['Phones & Gadgets','Fashion','Food','Home & Furniture','Services','Other'];
var AREAS=['Sabon Gari','Barade','Magami','Mayo Gwoi'];
var state={settings:{ownerWhatsApp:'',fees:'',adTitle:'',adText:'',adPhone:''},listings:[]};
var q='',cat='All',isOwner=false,dirty=false,manage=false,pendingDelete=null,formPhoto='';
var app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function naira(n){return '₦'+Number(n).toLocaleString('en-NG')}
function wa(num,text){
  var d=String(num||'').replace(/\D/g,'');if(!d)return '';
  if(d.charAt(0)==='0')d='234'+d.slice(1);else if(d.length===10)d='234'+d;
  return 'https://wa.me/'+d+(text?'?text='+encodeURIComponent(text):'');
}
function toast(m){var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},3200)}
function tileColor(c){var i=Math.max(0,CATS.indexOf(c))%5+1;return 'var(--t'+i+')'}
function initials(s){return String(s).trim().split(/\s+/).slice(0,2).map(function(w){return w.charAt(0)}).join('').toUpperCase()}

function shell(){
  app.innerHTML='<div class="wrap">'+
  '<header class="hero"><div class="brandrow"><span class="logo">J</span><b>Monetra</b></div>'+
  '<h1>Everything in Jalingo, one search away.</h1><p>See the price, then chat the seller on WhatsApp. Free to use, free to sell.</p>'+
  '<div class="heroact"><button class="btn pop" id="goSell" type="button">Sell your item free</button><span class="sticker">100% free</span></div></header>'+
  '<div class="ticker" aria-hidden="true"><div class="tk">'+CATS.concat(CATS).map(function(c){return '<span>'+esc(c)+'</span>'}).join('')+'</div></div>'+
  '<div class="search"><input id="q" type="search" placeholder="Search: phone, ankara, shoes, repair..." aria-label="Search listings" autocomplete="off"></div>'+
  '<div class="chips" id="chips" role="group" aria-label="Categories"></div>'+
  '<div id="ad"></div>'+
  '<div class="count" id="count" aria-live="polite"></div>'+
  '<div class="grid" id="grid"></div>'+
  '<section class="sell" id="sell"></section>'+
  '<footer><span>Monetra. Always meet in a public place and check the item before you pay.</span><span id="own"></span></footer>'+
  '<div id="admin"></div><div id="barHost"></div></div>';
  renderChips();renderGrid();renderSell();renderAd();renderOwner();
}
function renderChips(){
  var all=['All'].concat(CATS);
  document.getElementById('chips').innerHTML=all.map(function(c){return '<button type="button" class="chip" style="--c:'+(c==='All'?'var(--surface)':tileColor(c))+'" data-cat="'+esc(c)+'" aria-pressed="'+(c===cat)+'">'+esc(c)+'</button>'}).join('');
}
function visible(){
  var t=q.trim().toLowerCase();
  var list=state.listings.filter(function(l){
    if(cat!=='All'&&l.cat!==cat)return false;
    if(!t)return true;
    return (l.title+' '+l.desc+' '+l.area+' '+l.cat+' '+l.seller).toLowerCase().indexOf(t)>-1;
  });
  list.sort(function(a,b){return (b.featured?1:0)-(a.featured?1:0)});
  return list;
}
function renderGrid(){
  var list=visible();
  document.getElementById('count').textContent=list.length+(list.length===1?' item':' items')+(q||cat!=='All'?' found':' for sale');
  var g=document.getElementById('grid');
  if(!list.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">Nothing matches yet. Try a shorter word, or sell it yourself with the button above.</div>';return}
  g.innerHTML=list.map(function(l){
    var badge=l.sold?'<span class="badge sold">Sold</span>':(l.sample?'<span class="badge sample">Sample</span>':(l.featured?'<span class="badge">Featured</span>':''));
    var media=l.photo?'<img src="'+esc(l.photo)+'" alt="'+esc(l.title)+'" loading="lazy">':esc(initials(l.title));
    var link=(!l.sold&&!l.sample)?wa(l.phone,'Hello, I saw "'+l.title+'" ('+(l.price?naira(l.price):'price?')+') on Monetra. Is it still available?'):'';
    var btn=link?'<a class="btn wa" href="'+esc(link)+'" target="_blank" rel="noopener">Chat on WhatsApp</a>':'<span class="btn wa" aria-disabled="true">'+(l.sold?'Sold':(l.sample?'Example listing':'No contact'))+'</span>';
    return '<article class="card"><div class="tile" style="background:'+tileColor(l.cat)+'">'+badge+media+'</div>'+
      '<div class="cbody"><div class="price">'+(l.price?naira(l.price):'Ask price')+'</div><h3>'+esc(l.title)+'</h3>'+
      '<div class="meta">'+esc(l.area)+' · '+esc(l.seller)+'</div>'+(l.desc?'<div class="desc">'+esc(l.desc)+'</div>':'')+'<div class="spacer"></div>'+btn+'</div></article>';
  }).join('');
}
function renderAd(){
  var s=state.settings,el=document.getElementById('ad');
  var title=s.adTitle||'Your shop here',text=s.adText||'Reach people in Jalingo every day. Advertise on Monetra.';
  var link=wa(s.adTitle?s.adPhone:s.ownerWhatsApp,s.adTitle?'Hello, I saw your ad on Monetra.':'Hello, I want to advertise on Monetra.');
  el.innerHTML='<div class="ad"><div><span class="tag">'+(s.adTitle?'Ad':'Advertise here')+'</span><b>'+esc(title)+'</b><small>'+esc(text)+'</small></div>'+(link?'<a class="btn small" href="'+esc(link)+'" target="_blank" rel="noopener">'+(s.adTitle?'Chat':'Ask about ads')+'</a>':'')+'</div>';
}
function renderSell(){
  var s=state.settings,link=wa(s.ownerWhatsApp,'Hello, I want to sell on Monetra.');
  document.getElementById('sell').innerHTML='<h2>Sell on Monetra</h2>'+
   '<p>Stop posting on your status where it disappears in a day. Put it here and let buyers find it, see the price and chat with you.</p>'+
   '<div class="steps"><div>1. Send us the photo, name, price and your WhatsApp number.</div><div>2. We post it for you, free.</div><div>3. Buyers chat you directly on WhatsApp.</div></div>'+
   '<p><strong>Free for sellers.</strong> '+esc(s.fees)+'</p>'+
   (link?'<p><a class="btn pop" href="'+esc(link)+'" target="_blank" rel="noopener">Post my item free</a></p>':'<p>Contact number coming soon.</p>');
}
function renderOwner(){
  document.getElementById('own').innerHTML=isOwner?'<button class="btn ghost small" id="mng" type="button">'+(manage?'Close manager':'Manage listings')+'</button>':'';
  var a=document.getElementById('admin');
  if(!isOwner||!manage){a.innerHTML='';renderBar();return}
  var opts=CATS.map(function(c){return '<option>'+esc(c)+'</option>'}).join('');
  var dl=AREAS.map(function(c){return '<option value="'+esc(c)+'">'}).join('');
  a.innerHTML='<div class="panel"><h2>Add a listing</h2><div class="form">'+
   '<label class="full">Item name<input id="f_title" maxlength="80"></label>'+
   '<label>Price (₦)<input id="f_price" inputmode="numeric"></label>'+
   '<label>Category<select id="f_cat">'+opts+'</select></label>'+
   '<label>Area<input id="f_area" list="areas" maxlength="40"></label><datalist id="areas">'+dl+'</datalist>'+
   '<label>Seller name<input id="f_seller" maxlength="40"></label>'+
   '<label class="full">Seller WhatsApp number<input id="f_phone" inputmode="tel" placeholder="08012345678"></label>'+
   '<label class="full">Short description<textarea id="f_desc" rows="2" maxlength="160"></textarea></label>'+
   '<label class="full">Photo<input id="f_photo" type="file" accept="image/*"></label>'+
   '<label class="check full"><input id="f_feat" type="checkbox"> Featured (shows first)</label>'+
   '<div class="full"><button class="btn" id="addBtn" type="button">Add listing</button></div></div></div>'+
   '<div class="panel"><h2>Your listings</h2><div class="rows">'+state.listings.map(function(l){
     var del=pendingDelete===l.id;
     return '<div class="row"><div class="nm">'+esc(l.title)+(l.sample?' (sample)':'')+'</div><div class="acts">'+
      '<button class="btn ghost small" data-act="feat" data-id="'+l.id+'" type="button">'+(l.featured?'Unfeature':'Feature')+'</button>'+
      '<button class="btn ghost small" data-act="sold" data-id="'+l.id+'" type="button">'+(l.sold?'Mark available':'Mark sold')+'</button>'+
      '<button class="btn danger small" data-act="del" data-id="'+l.id+'" type="button">'+(del?'Tap again to delete':'Delete')+'</button></div></div>';
   }).join('')+(state.listings.length?'':'<div class="empty">No listings yet.</div>')+'</div></div>'+
   '<div class="panel"><h2>Your contact and ad spot</h2><div class="form">'+
   '<label class="full">Your WhatsApp number (sellers message this)<input id="s_phone" inputmode="tel" value="'+esc(state.settings.ownerWhatsApp)+'"></label>'+
   '<label class="full">Note shown to sellers<textarea id="s_fees" rows="2">'+esc(state.settings.fees)+'</textarea></label>'+'<label class="full">Advertiser name (empty shows Your shop here)<input id="s_adt" value="'+esc(state.settings.adTitle)+'"></label>'+'<label class="full">Advertiser message<input id="s_adm" value="'+esc(state.settings.adText)+'"></label>'+'<label class="full">Advertiser WhatsApp number<input id="s_adp" inputmode="tel" value="'+esc(state.settings.adPhone)+'"></label>'+
   '<div class="full"><button class="btn" id="saveSet" type="button">Save contact and fees</button></div></div></div>';
  renderBar();
}
function renderBar(){
  document.getElementById('barHost').innerHTML=dirty?'<div class="bar"><span>You have changes that are not live yet.</span><button class="btn" id="pub" type="button">Publish changes</button></div>':'';
}
function markDirty(){dirty=true;renderBar()}
function resize(file){return new Promise(function(res,rej){
  var r=new FileReader();r.onerror=rej;r.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){
    var m=520,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(file)})}

app.addEventListener('input',function(e){if(e.target.id==='q'){q=e.target.value;renderGrid()}});
app.addEventListener('change',function(e){
  if(e.target.id==='f_photo'){var f=e.target.files&&e.target.files[0];if(!f)return;resize(f).then(function(d){formPhoto=d;toast('Photo ready')}).catch(function(){toast('Could not read that photo. Try another one.')})}
});
app.addEventListener('click',function(e){
  var t=e.target.closest('button,a');if(!t)return;
  if(t.id==='goSell'){document.getElementById('sell').scrollIntoView({behavior:'smooth'});return}
  if(t.dataset.cat){cat=t.dataset.cat;renderChips();renderGrid();return}
  if(t.id==='mng'){manage=!manage;pendingDelete=null;renderOwner();return}
  if(t.id==='pub'){publish();return}
  if(t.id==='saveSet'){state.settings.ownerWhatsApp=document.getElementById('s_phone').value.trim();state.settings.fees=document.getElementById('s_fees').value.trim();state.settings.adTitle=document.getElementById('s_adt').value.trim();state.settings.adText=document.getElementById('s_adm').value.trim();state.settings.adPhone=document.getElementById('s_adp').value.trim();renderSell();renderAd();markDirty();toast('Saved. Publish to make it live.');return}
  if(t.id==='addBtn'){
    var title=document.getElementById('f_title').value.trim();
    if(!title){toast('Enter the item name first.');return}
    var p=parseInt(String(document.getElementById('f_price').value).replace(/\D/g,''),10)||0;
    state.listings.unshift({id:'l'+Date.now().toString(36),title:title,price:p,cat:document.getElementById('f_cat').value,area:document.getElementById('f_area').value.trim()||'Jalingo',seller:document.getElementById('f_seller').value.trim()||'Seller',phone:document.getElementById('f_phone').value.trim(),desc:document.getElementById('f_desc').value.trim(),photo:formPhoto,featured:document.getElementById('f_feat').checked,sold:false,sample:false});
    formPhoto='';renderGrid();renderOwner();markDirty();toast('Added. Publish to make it live.');return}
  if(t.dataset.act){
    var id=t.dataset.id,i=state.listings.findIndex(function(l){return l.id===id});if(i<0)return;
    if(t.dataset.act==='feat')state.listings[i].featured=!state.listings[i].featured;
    if(t.dataset.act==='sold')state.listings[i].sold=!state.listings[i].sold;
    if(t.dataset.act==='del'){if(pendingDelete!==id){pendingDelete=id;renderOwner();return}state.listings.splice(i,1);pendingDelete=null}
    renderGrid();renderOwner();markDirty()}
});
shell();
fetch('listings.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){state=d;state.settings=state.settings||{};renderGrid();renderSell();renderAd()}).catch(function(){document.getElementById('count').textContent='Could not load listings. Check your connection and refresh.'});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
